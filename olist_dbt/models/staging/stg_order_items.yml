version: 2

models:
  - name: stg_order_items
    description: "Cleaned and standardized Olist order items"
    columns:
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: order_item_id
        description: "Sequential item number within the order"
        tests:
          - not_null
      - name: product_id
        description: "Product identifier"
        tests:
          - not_null
      - name: price
        description: "Item price"
        tests:
          - not_null