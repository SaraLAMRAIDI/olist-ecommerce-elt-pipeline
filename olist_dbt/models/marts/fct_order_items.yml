version: 2

models:
  - name: fct_order_items
    description: "Order items fact table (grain: one row per order item)"
    columns:
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: order_item_id
        description: "Item number within the order"
        tests:
          - not_null
      - name: price
        description: "Item price"
        tests:
          - not_null
      - name: purchase_date
        description: "Date of purchase (foreign key to dim_date)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day